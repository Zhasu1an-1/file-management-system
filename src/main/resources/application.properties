spring.application.name=file-management-system
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/file_management_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
app.storage.directory=${UPLOAD_DIR:uploads}
